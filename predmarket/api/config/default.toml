[server]
host             = "0.0.0.0"
port             = 8080
shutdown_timeout = 5

[database]
max_connections = 20
min_connections = 2
connect_timeout = 10
idle_timeout    = 300
max_lifetime    = 1800

[nats]
url             = "nats://127.0.0.1:4222"
order_subject   = "predmarket.orders"
fill_subject    = "predmarket.fills"
depth_subject   = "predmarket.depth"
connect_timeout = 10
request_timeout = 200

[jwt]
ttl_secs = 86400

[engine]
submit_timeout_ms    = 100
cancel_timeout_ms    = 100
cb_failure_threshold = 10
cb_recovery_secs     = 30
