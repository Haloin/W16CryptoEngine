apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: predmarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          ports:
            - containerPort: 4222
            - containerPort: 8222
          command:
            - nats-server
          args:
            - --jetstream
            - --store_dir=/data/jetstream
            - --http_port=8222
          volumeMounts:
            - name: nats-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nats-data
          persistentVolumeClaim:
            claimName: nats-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: predmarket
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: predmarket
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  type: ClusterIP
