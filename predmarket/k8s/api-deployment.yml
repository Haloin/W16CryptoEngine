apiVersion: apps/v1
kind: Deployment
metadata:
  name: predmarket-api
  namespace: predmarket
  labels:
    app: predmarket-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: predmarket-api
  template:
    metadata:
      labels:
        app: predmarket-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - predmarket-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: predmarket/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: RUST_BACKTRACE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: predmarket-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: predmarket-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: predmarket-config
                  key: kafka-brokers
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: predmarket-secrets
                  key: jwt-secret
            - name: POLYMARKET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: predmarket-secrets
                  key: polymarket-api-key
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: predmarket-secrets
                  key: private-key
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: predmarket-api
---
apiVersion: v1
kind: Service
metadata:
  name: predmarket-api
  namespace: predmarket
  labels:
    app: predmarket-api
spec:
  type: ClusterIP
  selector:
    app: predmarket-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predmarket-api
  namespace: predmarket
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.predmarket.com
      secretName: predmarket-api-tls
  rules:
    - host: api.predmarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: predmarket-api
                port:
                  number: 8080
