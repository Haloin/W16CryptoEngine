apiVersion: v1
kind: Secret
metadata:
  name: predmarket-secrets
  namespace: predmarket
type: Opaque
stringData:
  database-url: "postgresql://postgres:postgres@postgres:5432/predmarket"
  redis-url: "redis://redis:6379"
  jwt-secret: "change-me-in-production-min-32-chars-long"
