apiVersion: v1
kind: ConfigMap
metadata:
  name: predmarket-config
  namespace: predmarket
data:
  kafka-brokers: "kafka:9092"
  polymarket-api-url: "https://clob.polymarket.com"
  polymarket-ws-url: "wss://clob.polymarket.com/ws"
  chain-id: "137"
  api-host: "0.0.0.0"
  api-port: "8080"
  api-workers: "8"
  cors-allowed-origins: "https://app.predmarket.com,https://admin.predmarket.com"
  rate-limit-rps: "100"
  rate-limit-burst: "150"
  metrics-enabled: "true"
  metrics-port: "9090"
  tracing-enabled: "true"
  otel-endpoint: "http://jaeger:4317"
  enable-analytics: "true"
  enable-ml-prediction: "true"
  enable-arbitrage-detection: "true"
  enable-risk-checks: "true"
  enable-audit-logging: "true"
  snapshot-enabled: "true"
  snapshot-interval: "300"
  circuit-breaker-failure-threshold: "5"
  circuit-breaker-reset-timeout: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hft-sysctl
  namespace: predmarket
data:
  99-hft-tuning.conf: |
    kernel.numa_balancing=0
    kernel.sched_rt_period_us=1000000
    kernel.sched_rt_runtime_us=950000
    vm.swappiness=0
    vm.dirty_ratio=5
    vm.dirty_background_ratio=2
    net.core.rmem_max=134217728
    net.core.wmem_max=134217728
    net.ipv4.tcp_rmem=4096 87380 134217728
    net.ipv4.tcp_wmem=4096 65536 134217728
    net.core.netdev_max_backlog=300000
    net.ipv4.tcp_congestion_control=bbr
    net.ipv4.tcp_notsent_lowat=16384
