[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/db",
    "crates/auth",
    "crates/orders",
    "crates/markets",
    "crates/positions",
    "crates/settlement",
    "crates/messaging",
    "crates/cache",
    "crates/api-http",
    "crates/audit",
    "crates/polymarket",
    "crates/blockchain",
]

[workspace.dependencies]
tokio       = { version = "1.37", features = ["full"] }
axum        = { version = "0.7", features = ["ws"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sqlx        = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "migrate"] }
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
reqwest     = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures     = "0.3"
url         = "2.5"
ethabi      = "18.0"
sha3        = "0.10"
secp256k1   = { version = "0.28", features = ["recovery", "global-context"] }
base64      = "0.22"
hex         = "0.4"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow      = "1"
thiserror   = "1"
async-trait = "0.1"
bytes       = "1"
dashmap     = "5"
moka        = { version = "0.12", features = ["future"] }
async-nats  = "0.35"
tower       = { version = "0.4", features = ["util", "timeout", "load-shed", "limit"] }
tower-http  = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }
prometheus  = { version = "0.13", features = ["process"] }
ethers      = { version = "2.0", features = ["ws", "rustls", "abigen"] }
hmac        = "0.12"
sha2        = "0.10"
rand        = "0.8"
config      = "0.14"
secrecy     = { version = "0.8", features = ["serde"] }
utoipa      = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
flatbuffers = "24"
rust_decimal = { version = "1.36", features = ["serde-float"] }
rust_decimal_macros = "1.36"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
