global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@predmarket.com'
  smtp_auth_username: ''
  smtp_auth_password: ''
  slack_api_url: ''
  pagerduty_url: ''
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: pagerduty
      continue: true
    - match:
        severity: warning
      receiver: slack
      continue: true
    - match:
        severity: info
      receiver: slack

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

receivers:
  - name: default
    email_configs:
      - to: 'ops@predmarket.com'
        send_resolved: true

  - name: slack
    slack_configs:
      - channel: '#predmarket-alerts'
        send_resolved: true
        title: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Started:* {{ .StartsAt }}
          {{ end }}

  - name: pagerduty
    pagerduty_configs:
      - service_key: ''
        description: '{{ .GroupLabels.alertname }}'
        severity: critical
        send_resolved: true
